<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>midicrt controllers</title>
<style>
  :root { --bg:#020b03; --panel:#04140699; --green:#4ade80; --dim:#15803d;
          --bright:#bbf7d0; --amber:#fbbf24; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--green);
         font-family:"IBM Plex Mono","Courier New",monospace; font-size:15px; }
  header { position:sticky; top:0; z-index:5; background:var(--bg);
           border-bottom:1px solid var(--dim); padding:8px 10px; }
  h1 { font-size:15px; margin:0 0 6px; color:var(--bright);
       letter-spacing:2px; text-transform:uppercase; }
  .tabs { display:flex; gap:6px; }
  .tabs button { flex:1; padding:10px 4px; background:transparent; color:var(--green);
        border:1px solid var(--dim); border-radius:6px; font:inherit; }
  .tabs button.on { background:var(--dim); color:var(--bright); font-weight:bold; }
  #hdr { color:var(--amber); font-size:12px; padding:6px 2px 0; min-height:1.2em; }
  #legend { color:var(--green); font-size:11px; padding:3px 2px 0; opacity:.85; }
  #status { color:var(--dim); font-size:11px; padding:2px; min-height:1.1em; }
  main { padding:8px; max-width:760px; margin:0 auto; }
  details { border:1px solid var(--dim); border-radius:8px; margin:8px 0;
            background:var(--panel); overflow:hidden; }
  summary { padding:10px 12px; color:var(--bright); cursor:pointer;
            letter-spacing:1px; user-select:none; }
  .field { display:grid; grid-template-columns:minmax(110px,1.1fr) 2fr auto;
           gap:8px; align-items:center; padding:7px 12px;
           border-top:1px solid #0b3d1c; }
  .field label { font-size:12px; overflow:hidden; text-overflow:ellipsis;
                 white-space:nowrap; }
  input[type=range] { width:100%; height:34px; accent-color:var(--green);
                      background:transparent; touch-action:none; }
  select, input[type=number] { background:#03210c; color:var(--bright);
      border:1px solid var(--dim); border-radius:6px; font:inherit;
      padding:8px 6px; max-width:170px; }
  .val { min-width:74px; text-align:right; color:var(--bright); font-size:12px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px; }
  .action { display:flex; align-items:center; gap:6px; }
  .action span { font-size:11px; }
  button.act { background:#03210c; color:var(--bright); border:1px solid var(--dim);
               border-radius:6px; font:inherit; padding:9px 10px; }
  button.act:active { background:var(--dim); }
  .err { color:#f87171; }
  .wavestrip { display:flex; align-items:stretch; gap:3px; flex-wrap:wrap; }
  .wavestrip .wave { flex:1 1 34px; min-width:34px; height:30px; padding:2px; background:transparent;
       color:var(--dim); border:1px solid #0b3d1c; border-radius:5px; transition:flex .15s, background .15s; }
  .wavestrip .wave.on { flex:1.8 1 60px; background:var(--green); color:#020b03; border-color:var(--bright);
       box-shadow:0 0 10px #4ade8088; }
  .wavestrip .wg { width:100%; height:100%; display:block; }
  .wavecap { flex-basis:100%; font-size:11px; color:var(--bright); padding-left:2px; }
</style>
</head>
<body>
<header>
  <h1>midicrt controllers</h1>
  <div class="tabs" id="tabs"></div>
  <div id="hdr"></div>
  <div id="legend"></div>
  <div id="status"></div>
</header>
<main id="main"></main>
<script>
"use strict";
let SCHEMA = null, current = null;
const $ = (s, el) => (el || document).querySelector(s);
const statusEl = () => $("#status");

function say(msg, err) {
  statusEl().textContent = msg;
  statusEl().className = err ? "err" : "";
}

async function api(path, body) {
  const opts = body
    ? { method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body) }
    : {};
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ok: false, error: "bad response"}));
  if (!j.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

// rate-limit slider spam: one in-flight POST per field, latest value wins
const pending = new Map();
function setField(dev, key, value) {
  pending.set(key, value);
  if (pending.get(key + "!inflight")) return;
  pending.set(key + "!inflight", true);
  (async function pump() {
    while (pending.has(key)) {
      const v = pending.get(key);
      pending.delete(key);
      try {
        await api("/api/manage/control/set", { device: dev, key, value: v });
        say(key + " = " + v);
      } catch (e) { say("set " + key + ": " + e.message, true); }
      // pace slider streams: old synth CPUs (Matrix-1000!) overload on
      // back-to-back parameter messages; trailing value still always sent
      await new Promise(r => setTimeout(r, 35));
    }
    pending.delete(key + "!inflight");
  })();
}

function stepDisplay(f, v) {
  if (v === null || v === undefined) return "--";
  if (f.dmin === undefined) return String(v);
  const frac = f.max > 0 ? v / f.max : 0;
  const dv = f.dmin + frac * (f.dmax - f.dmin);
  const num = Math.abs(f.dmax - f.dmin) >= 50 ? dv.toFixed(0) : dv.toFixed(2);
  return num + (f.unit || "");
}

function fieldRow(dev, f) {
  const row = document.createElement("div");
  row.className = "field";
  const lab = document.createElement("label");
  lab.textContent = f.label;
  row.appendChild(lab);
  if (f.type === "choice" && isWaveField(f)) {
    row.appendChild(waveStrip(dev, f));
    row.appendChild(document.createElement("span"));
    return row;
  }
  if (f.type === "choice") {
    const sel = document.createElement("select");
    f.choices.forEach((c, i) => {
      const o = document.createElement("option");
      o.value = f.min + i; o.textContent = c;
      sel.appendChild(o);
    });
    sel.value = f.value ?? f.min;
    sel.onchange = () => setField(dev, f.key, parseInt(sel.value, 10));
    row.appendChild(sel);
    row.appendChild(document.createElement("span"));
  } else {
    const r = document.createElement("input");
    r.type = "range"; r.min = f.min; r.max = f.max;
    r.dataset.key = f.key;
    r.value = (f.value === null || f.value === undefined)
      ? Math.round((f.min + f.max) / 2) : f.value;
    const val = document.createElement("span");
    val.className = "val";
    const show = () => {
      const v = parseInt(r.value, 10);
      val.textContent = f.type === "step" ? stepDisplay(f, v) : String(v);
    };
    if (f.value === null || f.value === undefined) val.textContent = "--";
    else show();
    r.oninput = () => { show(); setField(dev, f.key, parseInt(r.value, 10)); };
    row.appendChild(r);
    row.appendChild(val);
  }
  return row;
}

// --- waveform selector: glyph strip, selected one backlit + expanded ---
function isWaveField(f) {
  const n = f.label.toLowerCase();
  if (!(n.includes("wave"))) return false;
  const all = (f.choices || []).join(" ").toLowerCase();
  return /saw|square|pulse|tri|sine/.test(all);
}
const NOISE = [0.1,0.9,0.3,0.7,0.5,0.95,0.2,0.6,0.85,0.05,0.4,0.75,0.25,0.65,0.15,0.8,0.45,0.35,0.9,0.55];
function wavePoints(kind, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n; let v = 0.5;
    switch (kind) {
      case "sine": v = 0.5 + 0.5 * Math.sin(2 * Math.PI * t); break;
      case "tri": v = 1 - Math.abs(((t * 2 + 0.5) % 2) - 1); break;
      case "saw": v = 1 - (t % 1); break;
      case "sawup": v = t % 1; break;
      case "square": v = (t % 1) < 0.5 ? 1 : 0; break;
      case "pulse": v = (t % 1) < 0.25 ? 1 : 0; break;
      case "noise": v = NOISE[i % 20]; break;
      case "random": { const a = NOISE[Math.floor(i/4) % 20], b = NOISE[(Math.floor(i/4)+1) % 20]; v = a + (b - a) * ((i % 4) / 4); break; }
      case "sh": v = NOISE[Math.floor(i / 5) % 20]; break;
    }
    pts.push([t, v]);
  }
  return pts;
}
function waveKinds(label) {
  return label.split("+").map(p => {
    p = p.trim().toLowerCase();
    if (p === "off") return "off";
    if (p.startsWith("pulse")) return "pulse";
    if (p === "saw" || p === "sawtooth" || p === "saw down") return "saw";
    if (p === "saw up") return "sawup";
    if (p === "square" || p === "sqr") return "square";
    if (p === "triangle" || p === "tri") return "tri";
    if (p === "random") return "random";
    if (p === "noise") return "noise";
    if (p === "s&h" || p === "sample&hold" || p === "sample & hold") return "sh";
    if (p === "sine") return "sine";
    return "?";
  });
}
function waveGlyphSvg(label, W, H) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("class", "wg");
  for (const kind of waveKinds(label)) {
    if (kind === "?") {
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", W/2 - 4); t.setAttribute("y", H/2 + 4); t.textContent = "?";
      t.setAttribute("fill", "currentColor"); t.setAttribute("font-size", "12");
      svg.appendChild(t); continue;
    }
    const pl = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    const pts = kind === "off" ? [[0,0.5],[1,0.5]] : wavePoints(kind, Math.max(8, W/2));
    pl.setAttribute("points", pts.map(([t,v]) => `${2 + t*(W-4)},${2 + (1-v)*(H-4)}`).join(" "));
    pl.setAttribute("fill", "none"); pl.setAttribute("stroke", "currentColor"); pl.setAttribute("stroke-width", "2");
    svg.appendChild(pl);
  }
  return svg;
}
function waveStrip(dev, f) {
  const strip = document.createElement("div");
  strip.className = "wavestrip";
  const current = () => (f.value ?? f.min) - f.min;
  const render = () => {
    strip.innerHTML = "";
    f.choices.forEach((label, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "wave" + (i === current() ? " on" : "");
      b.title = label;
      b.appendChild(waveGlyphSvg(label, 48, 24));
      b.onclick = () => { f.value = f.min + i; render(); setField(dev, f.key, f.min + i); };
      strip.appendChild(b);
    });
    const cap = document.createElement("div");
    cap.className = "wavecap"; cap.textContent = f.choices[current()] || "";
    strip.appendChild(cap);
  };
  render();
  return strip;
}

function actionBar(dev, actions) {
  const bar = document.createElement("div");
  bar.className = "actions";
  actions.forEach(a => {
    const wrap = document.createElement("div");
    wrap.className = "action";
    if (a.type === "button") {
      const b = document.createElement("button");
      b.className = "act"; b.textContent = a.label;
      b.onclick = () => api("/api/manage/control/action", {device: dev, key: a.key})
        .then(() => say(a.label + " sent"))
        .catch(e => say(a.label + ": " + e.message, true));
      wrap.appendChild(b);
    } else if (a.type === "select") {
      const s = document.createElement("span"); s.textContent = a.label;
      const sel = document.createElement("select");
      a.options.forEach((o, i) => {
        const op = document.createElement("option");
        op.value = i; op.textContent = o;
        sel.appendChild(op);
      });
      if (a.value !== undefined) sel.value = a.value;
      sel.onchange = () => api("/api/manage/control/action",
          {device: dev, key: a.key, arg: parseInt(sel.value, 10)})
        .then(() => load(dev))
        .catch(e => say(a.key + ": " + e.message, true));
      wrap.appendChild(s); wrap.appendChild(sel);
    } else {
      const s = document.createElement("span"); s.textContent = a.label;
      const n = document.createElement("input");
      n.type = "number"; n.min = a.min; n.max = a.max;
      if (a.value !== undefined) n.value = a.value;
      const b = document.createElement("button");
      b.className = "act"; b.textContent = "go";
      b.onclick = () => api("/api/manage/control/action",
          {device: dev, key: a.key, arg: parseInt(n.value || "0", 10)})
        .then(() => { say(a.label + " -> " + n.value); load(dev); })
        .catch(e => say(a.key + ": " + e.message, true));
      wrap.appendChild(s); wrap.appendChild(n); wrap.appendChild(b);
    }
    bar.appendChild(wrap);
  });
  return bar;
}

// Live ADSR preview for any group carrying Attack/Decay/Sustain/Release
// fields (Matrix-1000 Env1-3, Bass Station envelopes, ...). Values are read
// straight from the group's sliders so the curve tracks every tweak.
function envGraphFor(g) {
  const find = (name) => g.fields.find(f => f.label.toLowerCase() === name
      || f.label.toLowerCase().endsWith(" " + name));
  const A = find("attack"), D = find("decay"), S = find("sustain"), R = find("release");
  if (!A || !D || !S || !R) return null;
  const DL = find("delay"), AMP = find("amplitude");
  const W = 300, H = 80, PAD = 4;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("style", "width:100%;max-width:340px;height:80px;display:block;margin:6px 12px 0");
  const poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  poly.setAttribute("fill", "none");
  poly.setAttribute("stroke", "#4ade80");
  poly.setAttribute("stroke-width", "2");
  svg.appendChild(poly);
  const wrap = document.createElement("div");
  wrap.appendChild(svg);
  const sliderVal = (f) => {
    const inp = wrap.closest("details")?.querySelector(`input[data-key="${f.key}"]`);
    const v = inp ? parseInt(inp.value, 10) : (f.value ?? Math.round(f.max / 2));
    return Math.max(0, Math.min(1, v / f.max));
  };
  const update = () => {
    const dl = DL ? sliderVal(DL) : 0;
    const a = sliderVal(A), dc = sliderVal(D), su = sliderVal(S), r = sliderVal(R);
    const peak = AMP ? sliderVal(AMP) : 1;
    const susY = su * peak;
    const seg = (v) => 0.06 + v * 0.22;
    const widths = [dl ? seg(dl) : 0.02, seg(a), seg(dc), 0.12, seg(r)];
    const total = widths.reduce((x, y) => x + y, 0);
    const ys = [0, 0, peak, susY, susY, 0];
    let x = PAD;
    const pts = [`${x},${H - PAD}`];
    for (let i = 0; i < widths.length; i++) {
      x += (widths[i] / total) * (W - 2 * PAD);
      const y = (H - PAD) - ys[i + 1] * (H - 2 * PAD);
      pts.push(`${x},${y}`);
    }
    poly.setAttribute("points", pts.join(" "));
  };
  return { el: wrap, update };
}

function render() {
  const dev = SCHEMA.devices.find(d => d.id === current) || SCHEMA.devices[0];
  current = dev.id;
  const tabs = $("#tabs");
  tabs.innerHTML = "";
  SCHEMA.devices.forEach(d => {
    const b = document.createElement("button");
    b.textContent = d.name.split(" ")[0];
    b.className = d.id === current ? "on" : "";
    b.onclick = () => { current = d.id; render(); };
    tabs.appendChild(b);
  });
  $("#hdr").textContent = "ch" + String(dev.channel).padStart(2, "0") + "  " + dev.header;
  $("#legend").textContent = dev.legend || "";
  const main = $("#main");
  main.innerHTML = "";
  const actions = document.createElement("details");
  actions.open = true;
  const asum = document.createElement("summary");
  asum.textContent = "program / actions";
  actions.appendChild(asum);
  actions.appendChild(actionBar(dev.id, dev.actions));
  main.appendChild(actions);
  dev.groups.forEach((g, gi) => {
    const d = document.createElement("details");
    if (gi === 0) d.open = true;
    const s = document.createElement("summary");
    s.textContent = g.name;
    d.appendChild(s);
    const env = envGraphFor(g);
    if (env) d.appendChild(env.el);
    g.fields.forEach(f => d.appendChild(fieldRow(dev.id, f)));
    if (env) {
      d.addEventListener("input", env.update);
      env.update();
    }
    main.appendChild(d);
  });
}

async function load(keepDev) {
  try {
    SCHEMA = await api("/api/control/schema");
    if (keepDev) current = keepDev;
    render();
    say("ready");
  } catch (e) { say("schema: " + e.message, true); }
}
load();
</script>
</body>
</html>
